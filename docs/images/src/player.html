<!doctype html>

<html lang="th"><head><meta charset="utf-8"><style>
* { box-sizing: border-box; }
body { margin: 0; width: 960px; height: 540px; overflow: hidden; background: #000; }
#movie_player { position: relative; width: 960px; height: 540px; overflow: hidden;
  background:
    radial-gradient(circle at 22% 18%, rgba(255,120,200,.55), transparent 28%),
    radial-gradient(circle at 78% 12%, rgba(90,160,255,.55), transparent 30%),
    radial-gradient(circle at 50% 110%, rgba(255,170,60,.45), transparent 45%),
    linear-gradient(180deg, #1b1033 0%, #2a1240 55%, #120a1f 100%); }
.beam { position: absolute; top: -40px; width: 140px; height: 520px; filter: blur(18px); opacity: .35;
  background: linear-gradient(180deg, rgba(255,255,255,.9), transparent); transform-origin: top center; }
.stage { position: absolute; left: 0; right: 0; bottom: 0; height: 170px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.85)); }
.singer { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); width: 120px; height: 260px; opacity: .55; }
/* real overlay CSS from extension/src/lyrics.js */
.karaoke-lyrics { position: absolute; left: 5%; right: 5%; bottom: 14%; z-index: 40; pointer-events: none;
  font: 700 30px/1.4 "Sukhumvit Set", "Noto Sans Thai", "YouTube Sans", Roboto, sans-serif; }
.karaoke-lyrics .kl-row { display: flex; margin: .1em 0; }
.karaoke-lyrics .kl-row[data-r="0"] { justify-content: flex-start; }
.karaoke-lyrics .kl-row[data-r="1"] { justify-content: flex-end; }
.karaoke-lyrics .kl-line { position: relative; white-space: nowrap; }
.karaoke-lyrics .kl-base, .karaoke-lyrics .kl-fill {
  text-shadow: 0 0 4px #000, 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000; }
.karaoke-lyrics .kl-base { color: #fff; }
.karaoke-lyrics .kl-fill { position: absolute; left: 0; top: 0; color: #3ec7ff; }
/* control bar */
.chrome { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; padding: 0 12px; z-index: 50; }
.progress { position: absolute; left: 12px; right: 12px; top: 6px; height: 4px; background: rgba(255,255,255,.25); }
.progress .played { width: 38%; height: 100%; background: #f00; }
.progress .loaded { position: absolute; left: 38%; top: 0; width: 30%; height: 100%; background: rgba(255,255,255,.4); }
.progress .dot { position: absolute; left: 38%; top: 50%; width: 13px; height: 13px; margin: -6.5px; border-radius: 50%; background: #f00; }
.bar { position: absolute; left: 12px; right: 12px; bottom: 8px; height: 40px; display: flex; align-items: center; justify-content: space-between; }
.side { display: flex; align-items: center; gap: 4px; }
.btn { width: 40px; height: 40px; display: grid; place-items: center; position: relative; }
.btn svg { width: 24px; height: 24px; }
.time { color: #eee; font: 500 13px Roboto, "YouTube Sans", sans-serif; margin-left: 8px; }
.on { background: rgba(255,255,255,.12); border-radius: 50%; }
.tip { position: absolute; bottom: 72px; z-index: 60; padding: 6px 10px; border-radius: 4px; background: rgba(28,28,28,.92);
  color: #fff; font: 500 13px/1.2 "Sukhumvit Set", Roboto, sans-serif; white-space: nowrap; transform: translateX(-50%); }
.badge { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 60; padding: 6px 12px; border-radius: 16px;
  background: rgba(0,0,0,.75); color: #fff; font: 500 13px/1.3 "Sukhumvit Set", Roboto, sans-serif; }
</style></head><body>
