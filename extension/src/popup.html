<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>🎤 YouTube Karaoke</h1>
  </header>

  <div class="label-row">
    <p class="label">ตัดเสียง (AI)</p>
    <button id="reset" class="reset" title="ไม่ตัดเสียงอะไรเลย">รีเซ็ต</button>
  </div>
  <div class="stems">
    <button class="stem" data-key="removeVocals" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/><path class="slash" d="M3 3l18 18"/>
      </svg>
      <span>ร้อง</span>
    </button>
    <button class="stem" data-key="removeGuitar" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 9c-2.1 0-3.6 1.3-3.6 3 0 .9.4 1.4.4 2 0 .7-1.8 1.3-1.8 3.4 0 2.5 2.3 4.6 5 4.6s5-2.1 5-4.6c0-2.1-1.8-2.7-1.8-3.4 0-.6.4-1.1.4-2 0-1.7-1.5-3-3.6-3z"/><path d="M12 9V2M10.5 2h3M10 18h4"/><path class="slash" d="M3 3l18 18"/>
      </svg>
      <span>กีตาร์</span>
    </button>
    <button class="stem" data-key="removeDrums" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <ellipse cx="12" cy="12" rx="8" ry="3"/><path d="M4 12v5c0 1.7 3.6 3 8 3s8-1.3 8-3v-5M8.5 9.5L5 3.5M15.5 9.5L19 3.5"/><path class="slash" d="M3 3l18 18"/>
      </svg>
      <span>กลอง</span>
    </button>
    <button class="stem" data-key="removeBass" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 9a5 5 0 0 1 10 0c0 4.5-4 8.5-10 11"/><circle cx="6" cy="9" r="1.8" fill="currentColor" stroke="none"/><circle cx="19" cy="7" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/><path class="slash" d="M3 3l18 18"/>
      </svg>
      <span>เบส</span>
    </button>
  </div>

  <label class="row slider">
    <span>เสียงร้องไกด์ <output id="guideOut"></output></span>
    <input type="range" id="guide" min="0" max="100" step="1">
  </label>

  <label class="row toggle sub">
    <span>หยุดวิดีโอรอ AI ให้ตัดเสียงทัน</span>
    <input type="checkbox" id="hold">
  </label>

  <p id="status" class="status"></p>
  <p id="detail" class="hint"></p>

  <hr>

  <div class="row toggle">
    <span>คีย์เพลง</span>
    <div class="stepper">
      <button id="keyDown" title="ลดคีย์ครึ่งเสียง" aria-label="ลดคีย์ครึ่งเสียง">−</button>
      <output id="keyOut" aria-live="polite"></output>
      <button id="keyUp" title="เพิ่มคีย์ครึ่งเสียง" aria-label="เพิ่มคีย์ครึ่งเสียง">+</button>
    </div>
  </div>
  <p id="keyHint" class="hint"></p>

  <hr>

  <label class="row toggle">
    <span>แสดงเนื้อเพลง</span>
    <input type="checkbox" id="lyrics">
  </label>

  <label class="row toggle sub">
    <span>ภาษาเนื้อเพลง</span>
    <select id="lyricsLang">
      <option value="th">ไทย</option>
      <option value="en">อังกฤษ</option>
      <option value="auto">ตามภาษาที่ร้อง</option>
    </select>
  </label>

  <label class="row slider">
    <span>เลื่อนเวลาเนื้อเพลง <output id="offsetOut"></output></span>
    <input type="range" id="lyricsOffset" min="-5" max="5" step="0.1">
  </label>

  <p id="lyricsStatus" class="hint"></p>

  <p class="hint">
    ครั้งแรกจะดาวน์โหลดโมเดล AI แล้วเก็บไว้ในเครื่อง (ตัดเสียงร้อง ~67MB, กีตาร์/กลอง/เบส ~136MB) ปุ่มบนแถบควบคุมของ YouTube ใช้เปิด/ปิดได้เหมือนกัน
  </p>

  <a class="donate" href="https://lazymodthai.github.io/karaoke/donate.html" target="_blank" rel="noopener">☕ สนับสนุนผู้พัฒนา (PromptPay)</a>

  <script src="popup.js"></script>
</body>
</html>
